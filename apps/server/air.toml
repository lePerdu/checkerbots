root = "."
tmp_dir = "tmp"
env_files = ["./apps/server/air.env"]

[build]
  cmd = "go build -o ./bin/server ./apps/server"
  entrypoint = ["./bin/server"]
  include_ext = ["go", "html", "css", "js"]
  exclude_dir = ["tmp"]
  delay = 200
  stop_on_error = true
  send_interrupt = true
  kill_delay = "50ms"

[log]
  time = true

[color]
  main = "yellow"
  watcher = "cyan"
  build = "green"
  runner = "magenta"

[misc]
  clean_on_exit = true

