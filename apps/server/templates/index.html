<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkerbots</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="panel">
      <div class="panel__header">
        <div>
          <h1>Checkerbots</h1>
          <p class="subtitle">Placeholder checkers UI</p>
        </div>
        <button id="new-game-button" class="button" type="button">New game</button>
      </div>

      <div class="status-row">
        <span class="status-label">Turn</span>
        <strong id="turn-indicator" class="turn-indicator">{{.Turn}}</strong>
      </div>

      <div class="board-wrapper">
        <div class="board" role="grid" aria-label="Checkers board">
          {{range .BoardCells}}
          <div
            class="square {{if .IsDark}}square--dark{{else}}square--light{{end}}"
            role="gridcell"
            aria-label="Square {{.SquareLabel}}">
            {{with .Piece}}
            <div class="{{.Classes}}" aria-label="{{.Side}} {{.Kind}}">{{.Label}}</div>
            {{end}}
          </div>
          {{end}}
        </div>
      </div>
    </section>
  </main>

  <script src="/static/app.js" defer></script>
</body>
</html>
