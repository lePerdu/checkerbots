<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkerbots</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="panel">
      <div class="panel__header">
        <div>
          <h1>Checkerbots</h1>
          <p id="message-label" class="subtitle"></p>
        </div>
        <button id="new-game-button" class="button" type="button">New game</button>
      </div>

      <div class="boards-row">
        <div class="board-wrapper">
          <p class="board-label">Game</p>
          <div class="board-with-captures">
            <div id="captured-black" class="captured-pieces captured-pieces--left" aria-label="Captured black pieces">
              <div class="captured-column captured-column--outer"></div>
              <div class="captured-column captured-column--inner"></div>
            </div>
            <div id="board" class="board" role="grid" aria-label="Checkers board"></div>
            <div id="captured-red" class="captured-pieces captured-pieces--right" aria-label="Captured red pieces">
              <div class="captured-column captured-column--outer"></div>
              <div class="captured-column captured-column--inner"></div>
            </div>
          </div>
        </div>
        <div class="board-wrapper">
          <p class="board-label">Robots</p>
          <div id="robot-board" class="board robot-board" aria-label="Robot positions"></div>
        </div>
      </div>

      <div class="move-controls">
        <button id="cancel-move-button" class="button button--secondary" type="button" disabled>Cancel</button>
      </div>
    </section>
  </main>

  <script src="/static/app.js" defer></script>
</body>
</html>
