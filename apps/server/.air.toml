root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./bin/server ./apps/server"
  bin = "./bin/server"
  include_ext = ["go", "tpl", "tmpl", "html", "css", "js"]
  exclude_dir = ["tmp"]
  delay = 200
  stop_on_error = true
  send_interrupt = true

[log]
  time = true

[color]
  main = "yellow"
  watcher = "cyan"
  build = "green"
  runner = "magenta"

[misc]
  clean_on_exit = true
